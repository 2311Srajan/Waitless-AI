spring.application.name=waitless-api
server.port=8080
management.endpoints.web.exposure.include=health,info
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/waitless}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:waitless}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:waitless}