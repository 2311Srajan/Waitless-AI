services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: waitless
      POSTGRES_USER: waitless
      POSTGRES_PASSWORD: waitless
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      AI_SERVICE_URL: http://ml-service:8000
    depends_on:
      - postgres
      - redis
      - ml-service

  ml-service:
    build: ./ml-service
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
